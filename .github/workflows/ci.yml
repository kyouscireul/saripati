name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Cache the one-time embedding model download between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.saripati/models
          key: minilm-model-v1
      - run: npm ci
      - run: npm run build
      - run: npm test
