name: Release

# Publishing to npm is deliberately NOT automated. The account requires a TOTP
# OTP at publish time, so releases go out by hand from a trusted machine:
#
#   npm run build && npm test
#   npm publish --access public --ignore-scripts --otp=<fresh code>
#
# (--ignore-scripts keeps the publish inside the OTP's ~30s window.)
# This workflow just turns the pushed tag into a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need history for the tag's annotation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts keeps better-sqlite3 from compiling — see ci.yml.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild sharp
      - run: npm run build
      - run: npm test
      - run: npm run test:install
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Prefer the annotated tag's own message; fall back to the commit subject.
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "${notes// }" ]; then
            notes="$(git log -1 --pretty=%B "$TAG")"
          fi
          printf '%s\n' "$notes" > release-notes.txt
          printf '\n\n---\n\nInstall: `npx saripati@%s setup`\n' "${TAG#v}" >> release-notes.txt
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.txt --verify-tag
