<body>
<div id="root"></div>

<script type="importmap">
{"imports":{"preact":"/vendor/preact.js","preact/hooks":"/vendor/hooks.js"}}
</script>
<script type="module">
import { h, render, Fragment } from '/vendor/preact.js';
import { useState, useEffect, useRef, useCallback, useMemo } from '/vendor/hooks.js';
import htm from '/vendor/htm.js';

const html = htm.bind(h);

// ── Utilities ────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function api(path) { return fetch(path).then(r => r.json()); }
function kindColor(k) {
  return { research:'var(--kr)', note:'var(--kn)', decision:'var(--kd)', pattern:'var(--kp)',
    question:'var(--kq)', memo:'var(--km)', intention:'var(--ki)' }[k] ?? 'var(--mt)';
}
// The vault's seven kinds — one source of truth so the sidebar filter and the
// entry-detail selector never drift apart (they used to hardcode only four).
const ALL_KINDS = ['research', 'note', 'decision', 'pattern', 'question', 'memo', 'intention'];

// ── Markdown renderer ────────────────────────────────────
function inlineMd(raw) {
  let s = esc(raw);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, `<span class="wikilink" data-target="$1">$2 &#8599;</span>`);
  s = s.replace(/\[\[([^\]]+)\]\]/g, `<span class="wikilink" data-target="$1">$1 &#8599;</span>`);
  return s;
}

function mdRender(raw) {
  const lines = (raw || '').split('\n');
  const out = [];
  let inList = false, inCode = false;
  const codeBuf = [];

  for (const line of lines) {
    if (line.startsWith('```')) {
      if (inCode) {
        out.push(`<pre><code>${codeBuf.map(esc).join('\n')}</code></pre>`);
        codeBuf.length = 0; inCode = false;
      } else { inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    const tr = line.trimStart();
    if (tr.startsWith('## ')) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h2>${inlineMd(tr.slice(3))}</h2>`);
    } else if (tr.startsWith('# ')) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<h3>${inlineMd(tr.slice(2))}</h3>`);
    } else if (tr.startsWith('> ')) {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<blockquote>${inlineMd(tr.slice(2))}</blockquote>`);
    } else if (tr.startsWith('- ') || tr.startsWith('* ')) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${inlineMd(tr.slice(2))}</li>`);
    } else if (tr === '---') {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push('<hr>');
    } else if (tr === '') {
      if (inList) { out.push('</ul>'); inList = false; }
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(`<p>${inlineMd(line)}</p>`);
    }
  }
  if (inList) out.push('</ul>');
  if (inCode) out.push(`<pre><code>${codeBuf.map(esc).join('\n')}</code></pre>`);
  return out.join('\n');
}

// ── Graph physics ────────────────────────────────────────
// Canvas palette. Node keys mirror the --kr/--kn/--kd/--kp/--kq/--km/--ki CSS vars
// (kindColor()) so a kind reads the same on the canvas as it does in the DOM.
// `relation` is magenta — the one hue no node kind uses, so an author-asserted
// edge can never be mistaken for a memo node's purple.
const GRAPH_COLORS = {
  light: { bg:'#F5F4EF', nodes:{research:'#D97800',note:'#888888',decision:'#2A8A2A',pattern:'#B86800',question:'#3A6EA5',memo:'#8A5CD9',intention:'#1F8A8A'}, edges:{relation:'#C2185B',wikilink:'#D97800',project:'#2A8A2A',tag:'rgba(0,0,0,0.12)'}, label:'#1A1A1A', ring:'rgba(0,0,0,0.2)', pin:'#D97800' },
  dark:  { bg:'#0F0F0F', nodes:{research:'#FF9E00',note:'#6A6A6A',decision:'#87D787',pattern:'#FFD700',question:'#6AA3E0',memo:'#B08CF0',intention:'#6AD0D0'}, edges:{relation:'#FF6FA5',wikilink:'#FF9E00',project:'#87D787',tag:'rgba(255,255,255,0.15)'}, label:'#E8E8E3', ring:'rgba(255,255,255,0.2)', pin:'#FF9E00' },
};
const EDGE_TYPES = ['relation', 'wikilink', 'project', 'tag'];

// ── Pill component ───────────────────────────────────────
function Pill({ label, active, onClick }) {
  return html`
    <button class=${`pill${active ? ' on' : ''}`} onClick=${onClick}>
      <span class="pill-dot"></span>${label}
    </button>`;
}

// ── Header ───────────────────────────────────────────────
function Header({ theme, onTheme, writeCfg, writeOn, onWrite, semanticCfg, semanticOn, onSemantic, entryCount }) {
  return html`
    <div class="hdr">
      <div class="hdr-l">
        <div><span class="mark">◈</span><span class="wordmark">S A R I P A T I</span></div>
        <span class="vaultpath">~/.saripati/vault.db</span>
      </div>
      <div class="hdr-r">
        ${entryCount != null && html`<span class="entry-count">${entryCount} entries</span>`}
        <${Pill} label=${theme} active=${theme === 'dark'} onClick=${() => onTheme(theme === 'light' ? 'dark' : 'light')}/>
        ${semanticCfg && html`<${Pill} label="--semantic" active=${semanticOn} onClick=${onSemantic}/>`}
        ${writeCfg && html`<${Pill} label="--write" active=${writeOn} onClick=${onWrite}/>`}
      </div>
    </div>`;
}

// ── Tabs ─────────────────────────────────────────────────
const TABS = ['steer', 'entries', 'graph', 'tags', 'identity'];
function Tabs({ tab, onTab }) {
  return html`
    <div class="tabs">
      ${TABS.map(t => html`
        <button key=${t} class=${`tab${tab === t ? ' on' : ''}`} onClick=${() => onTab(t)}>
          ${t.charAt(0).toUpperCase() + t.slice(1)}
        </button>`)}
    </div>`;
}

// ── Entry row ─────────────────────────────────────────────
function EntryRow({ entry, selected, onSelect, onProjectClick }) {
  const rowRef = useRef(null);
  const tags = (entry.tags || []).slice(0, 4).map(t => `#${t}`).join(' ');

  useEffect(() => {
    if (selected && rowRef.current) {
      rowRef.current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }, [selected]);

  return html`
    <div ref=${rowRef} class=${`erow${selected ? ' on' : ''}`} onClick=${() => onSelect(entry.id)}>
      <div class="erow-meta">
        <span class="erow-kind" style=${{ color: kindColor(entry.kind) }}>${entry.kind}</span>
        ${entry.project && html`
          <span class="erow-proj" title="Filter by @${entry.project}"
            onClick=${e => { e.stopPropagation(); onProjectClick && onProjectClick(entry.project); }}>
            @${entry.project}
          </span>`}
      </div>
      <div class="erow-title">${entry.title}</div>
      ${tags && html`<div class="erow-tags">${tags}</div>`}
    </div>`;
}

// ── Sidebar ───────────────────────────────────────────────
function Sidebar({ query, onQuery, kindFilter, onKind, statusFilter, onStatus, tagFilter, onTagClear, projectFilter, onProjectClick, entries, selectedId, onSelect, onExport, status, totalCount, sentinelRef, hasMore }) {
  const KINDS = ALL_KINDS;
  const STATUSES = ['active', 'superseded', 'archived'];
  const inputRef = useRef(null);
  const [isFocused, setIsFocused] = useState(false);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === '/' && document.activeElement !== inputRef.current && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        inputRef.current?.focus();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  const counts = status?.byKind || {};

  return html`
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="search-row">
          <div class="search-wrap">
            <input ref=${inputRef} class="q" type="text" placeholder="search entries…" value=${query}
              onFocus=${() => setIsFocused(true)}
              onBlur=${() => setIsFocused(false)}
              onInput=${e => onQuery(e.target.value)} autocomplete="off"/>
            ${query
              ? html`<button class="q-clear" title="Clear query" onClick=${() => onQuery('')}>×</button>`
              : (!isFocused && html`<span class="q-key-hint">/</span>`)}
          </div>
          <button class="export-btn" title="Export markdown view" onClick=${onExport}>export ↓</button>
        </div>
        <div class="search-meta-row">
          <span class="search-count">
            ${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}${totalCount && entries.length !== totalCount ? ` (of ${totalCount})` : ''}
          </span>
        </div>
        <div class="kind-chips">
          ${KINDS.map(k => {
            const count = counts[k];
            return html`
              <button key=${k} class=${`kchip${kindFilter === k ? ' on' : ''}`}
                onClick=${() => onKind(k)}>
                ${k} ${count != null ? html`<span class="kchip-count">${count}</span>` : ''}
              </button>`;
          })}
        </div>
        <div class="status-chips">
          ${STATUSES.map(s => html`
            <button key=${s} class=${`schip${statusFilter === s ? ' on' : ''}`}
              onClick=${() => onStatus(s)}>${s}</button>`)}
        </div>
        ${tagFilter && html`
          <div class="tag-active">
            tag: <span class="tag-active-val">#${tagFilter}</span>
            <span class="tag-clear" onClick=${onTagClear}>clear ×</span>
          </div>`}
        ${projectFilter && html`
          <div class="tag-active">
            project: <span class="tag-active-val">@${projectFilter}</span>
            <span class="tag-clear" onClick=${() => onProjectClick(projectFilter)}>clear ×</span>
          </div>`}
      </div>
      <div class="entry-list">
        ${!entries.length
          ? html`<div class="no-results">no entries match filters${query ? ` for "${query}"` : ''}</div>`
          : entries.map(e => html`
            <${EntryRow} key=${e.id} entry=${e} selected=${selectedId === e.id}
              onSelect=${onSelect} onProjectClick=${onProjectClick}/>`)}
        ${hasMore && html`<div ref=${sentinelRef} style="height:1px;flex-shrink:0"></div>`}
      </div>
      <div class="sidebar-footer">
        <span>${status?.total ?? '–'} entries</span>
        <span class="sf-dot"></span>
        <span>${status?.projects ?? '–'} projects</span>
        <span class="sf-dot"></span>
        <span>${status?.sessions ?? '–'} sessions</span>
        ${status?.lastUpdated ? html`
          <span class="sf-dot"></span>
          <span>updated ${status.lastUpdated.slice(0,10)}</span>` : ''}
        ${status?.version ? html`
          <span class="sf-dot"></span>
          <span title="running saripati version — if this lags the version you installed, hard-refresh (Ctrl+Shift+R)">v${status.version}</span>` : ''}
      </div>
    </div>`;
}

// ── Corpus status ─────────────────────────────────────────
function CorpusStatus({ status }) {
  if (!status) return html`<div class="status-view"><div class="stat-lbl">loading…</div></div>`;
  const total = status.total || 0;
  const max = Math.max(1, total);
  const kinds = ALL_KINDS.map(k => ({ k, label: k }));
  return html`
    <div class="status-view">
      <div class="stat-lbl">Corpus Status</div>
      <div class="stat-nums">
        <div><div class="stat-num">${total}</div><div class="stat-sub">entries</div></div>
        <div><div class="stat-num">${status.projects || 0}</div><div class="stat-sub">projects</div></div>
        <div><div class="stat-num">${status.sessions || 0}</div><div class="stat-sub">sessions</div></div>
      </div>
      <div class="kind-bars">
        ${kinds.map(({ k, label }) => {
          const n = (status.byKind || {})[k] || 0;
          const pct = Math.round((n / max) * 100);
          return html`
            <div key=${k}>
              <div class="kb-row-label">
                <span style=${{ color: kindColor(k) }}>${label}</span>
                <span style="color:var(--mt)">${n}</span>
              </div>
              <div class="kb-track">
                <div class="kb-fill" style=${{ width: `${pct}%`, background: kindColor(k) }}></div>
              </div>
            </div>`;
        })}
      </div>
      ${status.lastUpdated && html`<div style="font-size:11px;color:var(--mt)">last updated ${status.lastUpdated.slice(0,10)}</div>`}
    </div>`;
}

// ── Sessions panel (right sidebar in entry detail view) ───
function SessionsPanel({ sessions }) {
  if (!sessions || !sessions.length) return html`
    <div class="sessions-panel">
      <div class="sp-hdr">Sessions</div>
      <div style="font-size:11px;color:var(--mt)">No sessions yet.</div>
    </div>`;

  return html`
    <div class="sessions-panel">
      <div class="sp-hdr">Recent Sessions</div>
      ${sessions.map((s, i) => html`
        <div key=${i} class="sp-card">
          <div class="sp-card-title">${s.title}</div>
          <div class="sp-card-date">${(s.created_at || '').slice(0,10)}</div>
          <div class="sp-card-summary">${s.summary}</div>
          ${s.next_steps && s.next_steps.length > 0 && html`
            <div class="sp-card-steps">
              ${s.next_steps.slice(0,3).map((step, j) => html`
                <div key=${j} class="sp-step">
                  <span class="sp-step-arrow">▸</span>
                  <span>${step}</span>
                </div>`)}
            </div>`}
        </div>`)}
    </div>`;
}

// ── Entry detail ──────────────────────────────────────────
function EntryDetail({ entryId, writeOn, onWikiClick, onBacklinkClick, allEntries }) {
  const [data, setData] = useState(null);
  const [backlinks, setBacklinks] = useState([]);
  const [newTag, setNewTag] = useState('');
  const [loading, setLoading] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => {
    if (!entryId) return;
    setLoading(true);
    setData(null);
    Promise.all([api(`/api/entry/${entryId}`), api(`/api/backlinks/${entryId}`)])
      .then(([e, bls]) => {
        setData(e);
        setBacklinks(bls || []);
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }, [entryId]);

  useEffect(() => {
    if (!bodyRef.current || !data) return;
    bodyRef.current.innerHTML = mdRender(data.body || '');
    bodyRef.current.querySelectorAll('.wikilink').forEach(span => {
      span.addEventListener('click', () => {
        const target = span.dataset.target || '';
        onWikiClick(target);
      });
    });
  }, [data]);

  if (loading || !data) {
    return html`
      <div class="det-inner">
        <div class="skel" style="height:14px;width:120px;margin-bottom:12px"></div>
        <div class="skel skel-title"></div>
        <div class="skel skel-p" style="margin-top:20px"></div>
        <div class="skel skel-p"></div>
        <div class="skel skel-p short"></div>
      </div>`;
  }

  const removeTag = async (tag) => {
    const updated = (data.tags || []).filter(t => t !== tag);
    await fetch(`/api/entry/${entryId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tags: updated }) });
    setData({ ...data, tags: updated });
  };

  const addTag = async (e) => {
    if (e.key !== 'Enter' || !newTag.trim()) return;
    const updated = [...(data.tags || []), newTag.trim()];
    await fetch(`/api/entry/${entryId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tags: updated }) });
    setData({ ...data, tags: updated });
    setNewTag('');
  };

  const changeKind = async (kind) => {
    await fetch(`/api/entry/${entryId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind }) });
    setData({ ...data, kind });
  };

  // Lifecycle metadata patch (resolved for questions, active for intentions).
  // Gated on writeOn at the call site; explicit user action only — never auto-flipped.
  const patchLifecycle = async (patch) => {
    const res = await fetch(`/api/entry/${entryId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) });
    if (res.ok) setData({ ...data, ...patch });
  };

  return html`
    <div class="det-inner">
      <div class="det-meta">
        <span class="kind-pill" style=${{ background: kindColor(data.kind) + '22', color: kindColor(data.kind) }}>${data.kind}</span>
        ${data.status && data.status !== 'active' && html`<span class="kind-pill" style=${{ background:'var(--er)22', color:'var(--er)' }}>${data.status}</span>`}
        ${data.project && html`<span class="det-proj">@${data.project}</span>`}
        <span class="det-date">${(data.created_at || '').slice(0,10)}</span>
      </div>
      <div class="det-title">${data.title}</div>
      ${data.confidence != null && html`
        <div class="det-conf">
          CONFIDENCE — ${Math.round(data.confidence * 100)}%
          <div class="conf-track"><div class="conf-fill" style=${{ width: `${data.confidence*100}%` }}></div></div>
        </div>`}
      ${data.superseded_by != null && html`
        <div class="det-super" onClick=${() => onBacklinkClick(data.superseded_by)}>
          <span>⤳ superseded by entry #${data.superseded_by} — open →</span>
        </div>`}
      ${data.kind === 'question' && (writeOn
        ? html`<label class="lifecycle-toggle">
            <input type="checkbox" checked=${data.resolved === true}
              onChange=${e => patchLifecycle({ resolved: e.target.checked })}/>
            mark resolved
          </label>`
        : (data.resolved === true && html`<span class="kind-pill" style=${{ background:'var(--kd)22', color:'var(--kd)', marginTop:'14px', display:'inline-block' }}>resolved</span>`))}
      ${data.kind === 'intention' && (writeOn
        ? html`<label class="lifecycle-toggle">
            <input type="checkbox" checked=${data.active === true}
              onChange=${e => patchLifecycle({ active: e.target.checked })}/>
            still active
          </label>`
        : (data.active === false && html`<span class="kind-pill" style=${{ background:'var(--mt)22', color:'var(--mt)', marginTop:'14px', display:'inline-block' }}>inactive</span>`))}
      <div class="kind-wrap">
        <span style="color:var(--mt)">kind:</span>
        <select class="kind-sel" value=${data.kind} disabled=${!writeOn} onChange=${e => changeKind(e.target.value)}>
          ${ALL_KINDS.map(k => html`<option key=${k} value=${k}>${k}</option>`)}
        </select>
        ${writeOn
          ? html`<span style="font-size:10px;color:var(--mt)">edits save to the vault</span>`
          : html`<span style="font-size:10px;color:var(--mt)">read-only — start with --write to edit</span>`}
      </div>
      <div class="det-tags">
        ${(data.tags || []).map(t => html`
          <span key=${t} class="tag-chip">
            #${t}
            ${writeOn && html`<button class="tag-rm" title="Remove tag" onClick=${() => removeTag(t)}>×</button>`}
          </span>`)}
        ${writeOn && html`
          <input class="tag-add-inp" placeholder="+ tag" value=${newTag}
            onInput=${e => setNewTag(e.target.value)}
            onKeyDown=${addTag}/>`}
      </div>
      <div class="det-body" ref=${bodyRef}></div>
      ${(data.sources || []).length > 0 && html`
        <div class="det-section">
          <div class="det-sec-title">Sources</div>
          ${data.sources.map((s, i) => html`
            <div key=${i} class="src-card">
              ${s.url
                ? html`<a class="src-title" href=${s.url} target="_blank" rel="noopener">${s.title || s.url}</a>`
                : html`<span class="src-title">${s.title || 'source'}</span>`}
              ${s.snippet && html`<div class="src-snip">${s.snippet}</div>`}
            </div>`)}
        </div>`}
      ${(data.links || []).length > 0 && html`
        <div class="det-section">
          <div class="det-sec-title">Links</div>
          ${data.links.map((l, i) => html`
            <div key=${i} class="bl-row" onClick=${() => onBacklinkClick(l.id)}>
              <span class="kind-pill" style=${{ background:'var(--am)22', color:'var(--am)' }}>${l.rel}</span>
              <span class="bl-title">entry #${l.id}</span>
            </div>`)}
        </div>`}
      ${backlinks.length > 0 && html`
        <div class="det-section">
          <div class="det-sec-title">Backlinks</div>
          ${backlinks.map(bl => html`
            <div key=${bl.id} class="bl-row" onClick=${() => onBacklinkClick(bl.id)}>
              <span class="bl-dot" style=${{ background: kindColor(bl.kind) }}></span>
              <span class="bl-title">${bl.title}</span>
            </div>`)}
        </div>`}
      <div style="margin-top:24px">
        <button class="export-btn" onClick=${() => { window.location = `/api/export`; }}>export view ↓</button>
      </div>
    </div>`;
}

// ── Entries panel ─────────────────────────────────────────
const PAGE = 50;

function EntriesPanel({ active, status, writeOn, selectedId, onSelectId, query, onQuery, kindFilter, onKind, statusFilter, onStatus, tagFilter, onTagFilter, projectFilter, onProjectFilter }) {
  const [entries, setEntries] = useState([]);
  const [hasMore, setHasMore] = useState(false);
  const debounce = useRef(null);
  const offsetRef = useRef(0);
  const sentinelRef = useRef(null);
  const filtersRef = useRef({ q: '', kind: '', tag: '', project: '', status: '' });

  const fetchPage = useCallback(async (q, kind, tag, project, entryStatus, offset, append) => {
    const p = new URLSearchParams();
    if (q) p.set('q', q);
    if (kind) p.set('kind', kind);
    if (tag) p.set('tag', tag);
    if (project) p.set('project', project);
    if (entryStatus) p.set('status', entryStatus);
    p.set('semantic', '1');
    // Only paginate when browsing without a text query — search returns ranked results.
    if (!q) {
      p.set('limit', String(PAGE));
      p.set('offset', String(offset));
    }
    const data = await api(`/api/entries?${p}`);
    const rows = data || [];
    if (append) setEntries(prev => [...prev, ...rows]);
    else setEntries(rows);
    // Paginate only in plain browse mode — search, tag/project/non-active-status
    // filters fetch a full set server-side so infinite scroll is not needed.
    const paginating = !q && !tag && !project && (!entryStatus || entryStatus === 'active');
    setHasMore(paginating && rows.length === PAGE);
  }, []);

  useEffect(() => {
    clearTimeout(debounce.current);
    const { q, kind, tag, project, status: st } = { q: query, kind: kindFilter, tag: tagFilter, project: projectFilter, status: statusFilter };
    debounce.current = setTimeout(() => {
      offsetRef.current = 0;
      filtersRef.current = { q, kind, tag, project, status: st };
      fetchPage(q, kind, tag, project, st, 0, false);
    }, 180);
  }, [query, kindFilter, tagFilter, projectFilter, statusFilter]);

  // IntersectionObserver — load next page when sentinel scrolls into view.
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !hasMore) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      const nextOffset = offsetRef.current + PAGE;
      offsetRef.current = nextOffset;
      const { q, kind, tag, project, status: st } = filtersRef.current;
      fetchPage(q, kind, tag, project, st, nextOffset, true);
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [hasMore, fetchPage]);

  const handleExport = () => {
    const p = new URLSearchParams();
    if (query) p.set('q', query);
    if (kindFilter) p.set('kind', kindFilter);
    if (tagFilter) p.set('tag', tagFilter);
    p.set('semantic', '1');
    window.location = `/api/export?${p}`;
  };

  const handleWiki = (target) => {
    const normalized = target.toLowerCase().trim();
    const match = entries.find(e => e.title.toLowerCase().trim() === normalized);
    if (match) { onSelectId(match.id); }
    else { onQuery(target); onSelectId(null); }
  };

  return html`
    <div class=${`panel entry-panel${active ? '' : ' hidden'}`}>
      <${Sidebar}
        query=${query} onQuery=${onQuery}
        kindFilter=${kindFilter} onKind=${onKind}
        statusFilter=${statusFilter} onStatus=${onStatus}
        tagFilter=${tagFilter} onTagClear=${() => onTagFilter('')}
        projectFilter=${projectFilter} onProjectClick=${onProjectFilter}
        entries=${entries} selectedId=${selectedId} onSelect=${onSelectId}
        onExport=${handleExport} status=${status} totalCount=${status?.total}
        sentinelRef=${sentinelRef} hasMore=${hasMore}/>
      <div class="detail">
        ${selectedId ? html`
          <div class="det-scroll">
            <${EntryDetail} entryId=${selectedId} writeOn=${writeOn} onWikiClick=${handleWiki} onBacklinkClick=${onSelectId} allEntries=${entries}/>
          </div>
          <${SessionsPanel} sessions=${status?.sessions_recent}/>
        ` : html`
          <div class="det-scroll">
            <${CorpusStatus} status=${status}/>
          </div>`}
      </div>
    </div>`;
}

// ── Graph panel ───────────────────────────────────────────
function GraphPanel({ active, theme, selectedId, onSelect }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const [legendOpen, setLegendOpen] = useState(true);
  const [search, setSearch] = useState('');
  const [matchCount, setMatchCount] = useState(0);
  const [edgeFilter, setEdgeFilter] = useState({ relation:true, wikilink:true, project:true, tag:true });
  const [pinCount, setPinCount] = useState(0);
  const searchRef = useRef(null);
  // initGraph is a useCallback and must not re-run when a filter toggles, so it
  // reads the live filter through a ref rather than taking it as a dependency.
  const edgeFilterRef = useRef(edgeFilter);
  const G = useRef({ nodes:[], edges:[], raf:null, dragging:null, dragStart:null, hovered:null, ctx:null,
    scale:1, panX:0, panY:0, panning:false, panStart:null, _frame:0, _userViewport:false,
    search:'', edgeFilter:null, suppressClick:false, wasPinned:false });

  const initGraph = useCallback((canvas, data) => {
    const W = canvas.width;
    const H = canvas.height;
    const ctx = canvas.getContext('2d');
    G.current.ctx = ctx;

    // Place nodes on a circle sized to match the canvas; unclamped physics
    // will spread them outward, and fitToView() shows the full layout at settle.
    G.current.nodes = (data.nodes || []).slice(0, 150).map((n, i, arr) => {
      const angle = (i / Math.max(arr.length, 1)) * Math.PI * 2;
      const r = Math.min(W, H) * 0.38;
      const tags = n.tags || [];
      return { id: n.id, title: n.title, kind: n.kind, project: n.project ?? null, tags,
        // Precomputed search haystack. Deliberately excludes `description` — it's
        // a 200-char body excerpt, so including it makes most queries match most nodes.
        hay: `${n.title} ${n.kind} ${n.project || ''} ${tags.join(' ')}`.toLowerCase(),
        x: W/2 + Math.cos(angle)*r, y: H/2 + Math.sin(angle)*r,
        vx:0, vy:0, pinned:false, deg:0, r:6, _match:false };
    });
    G.current.nodeMap = new Map(G.current.nodes.map(n => [n.id, n]));
    G.current.edges = (data.edges || []).slice(0, 600);
    G.current.edgeFilter = edgeFilterRef.current;
    computeDegrees(G.current);
    G.current.dragging = null; G.current.dragStart = null;
    G.current.scale = 1; G.current.panX = 0; G.current.panY = 0;
    G.current.panning = false; G.current.panStart = null;
    G.current._frame = 0;

    // Restore persisted pins BEFORE the pre-warm so they anchor the layout
    // instead of being dragged around by it. Re-saving prunes ids that no
    // longer exist (deleted entries, or a different vault).
    for (const p of loadPins()) {
      const n = G.current.nodeMap.get(p.id);
      if (n) { n.x = p.x; n.y = p.y; n.pinned = true; }
    }
    savePins(G.current.nodes);
    setPinCount(G.current.nodes.filter(n => n.pinned).length);

    // Pre-warm without noise so nodes partially spread before the first visible frame.
    for (let t = 0; t < 80; t++) physicsStep(canvas, G.current, false);

    if (G.current.raf) cancelAnimationFrame(G.current.raf);
    tick(canvas, G.current, selectedId);
  }, [selectedId]);

  // Load graph data
  useEffect(() => {
    if (!active || !canvasRef.current) return;
    api('/api/graph').then(data => {
      if (canvasRef.current) initGraph(canvasRef.current, data);
    });
    return () => { if (G.current.raf) cancelAnimationFrame(G.current.raf); };
  }, [active]);

  // Dynamic resize observer to prevent 150px canvas collapse
  useEffect(() => {
    if (!wrapRef.current || !canvasRef.current) return;
    const resize = () => {
      const w = wrapRef.current.clientWidth;
      const h = wrapRef.current.clientHeight;
      if (w > 0 && h > 0 && (canvasRef.current.width !== w || canvasRef.current.height !== h)) {
        canvasRef.current.width = w;
        canvasRef.current.height = h;
        if (G.current.ctx) {
          G.current.settled = false;
          drawGraph(canvasRef.current, G.current, selectedId);
        }
      }
    };
    const ro = new ResizeObserver(resize);
    ro.observe(wrapRef.current);
    resize();
    return () => ro.disconnect();
  }, [active]);

  useEffect(() => {
    if (G.current.ctx) drawGraph(canvasRef.current, G.current, selectedId);
  }, [selectedId, theme]);

  // Search: stamp matches onto the nodes once per change, so drawGraph stays a
  // pure reader at 60fps. G is a ref, so the explicit repaint is mandatory —
  // setState alone paints nothing.
  useEffect(() => {
    const term = search.trim().toLowerCase();
    G.current.search = term;
    let n = 0;
    for (const nd of G.current.nodes) {
      nd._match = term ? nd.hay.includes(term) : false;
      if (nd._match) n++;
    }
    setMatchCount(n);
    if (G.current.ctx) drawGraph(canvasRef.current, G.current, selectedId);
  }, [search, selectedId]);

  // Edge filter changes the forces (hidden edges leave the simulation too), so
  // this recomputes degrees and restarts the physics rather than just redrawing.
  useEffect(() => {
    edgeFilterRef.current = edgeFilter;
    G.current.edgeFilter = edgeFilter;
    if (!G.current.ctx || !G.current.nodes.length) return;
    computeDegrees(G.current);
    restartTick(canvasRef.current, G.current, selectedId);
  }, [edgeFilter]);

  // '/' to focus, Escape to clear — registered only while the graph tab is up.
  // The Sidebar's global '/' handler also fires, but it focuses an input inside
  // a display:none panel, which is a silent no-op. Don't "fix" one without the other.
  useEffect(() => {
    if (!active) return;
    const onKey = (e) => {
      const tag = document.activeElement?.tagName;
      if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        searchRef.current?.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchRef.current) {
        setSearch('');
        searchRef.current.blur();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [active]);

  const syncPins = () => {
    savePins(G.current.nodes);
    setPinCount(G.current.nodes.filter(n => n.pinned).length);
  };

  const unpinAll = () => {
    G.current.nodes.forEach(n => { n.pinned = false; });
    syncPins();
    restartTick(canvasRef.current, G.current, selectedId);
  };

  const resetGraph = () => {
    if (!canvasRef.current || !G.current.nodes.length) return;
    const canvas = canvasRef.current;
    const W = canvas.width || 800;
    const H = canvas.height || 600;
    G.current.nodes.forEach((n, i, arr) => {
      // Pinned nodes hold their position through a reset — that's the point of a pin.
      if (n.pinned) { n.vx = 0; n.vy = 0; return; }
      const angle = (i / Math.max(arr.length, 1)) * Math.PI * 2;
      n.x = W/2 + Math.cos(angle) * Math.min(W,H) * 0.38;
      n.y = H/2 + Math.sin(angle) * Math.min(W,H) * 0.38;
      n.vx = 0; n.vy = 0;
    });
    G.current.scale = 1; G.current.panX = 0; G.current.panY = 0;
    G.current._frame = 0; G.current._userViewport = false;
    for (let t = 0; t < 80; t++) physicsStep(canvas, G.current, false);
    restartTick(canvas, G.current, selectedId);
  };

  // Helper: screen coords from mouse event (not world-projected)
  const screenCoords = useCallback(e => {
    const r = canvasRef.current.getBoundingClientRect();
    const W = canvasRef.current.width, H = canvasRef.current.height;
    return { sx: (e.clientX - r.left) * (W / r.width), sy: (e.clientY - r.top) * (H / r.height) };
  }, []);

  // Helper: screen → world coords
  const toWorld = useCallback((sx, sy) => {
    const sc = G.current.scale || 1;
    return { x: (sx - (G.current.panX || 0)) / sc, y: (sy - (G.current.panY || 0)) / sc };
  }, []);

  const onMouseDown = useCallback(e => {
    const { sx, sy } = screenCoords(e);
    const pos = toWorld(sx, sy);
    const hit = hitNode(pos, G.current.nodes);
    if (hit) {
      // Shift-click toggles the pin. Handled here rather than as a dblclick
      // because dblclick lands after two full down/up pairs — the click path
      // would already have fired onSelect and switched tabs.
      if (e.shiftKey) {
        hit.pinned = !hit.pinned;
        hit.vx = 0; hit.vy = 0;
        syncPins();
        G.current.suppressClick = true;
        restartTick(canvasRef.current, G.current, selectedId);
        return;
      }
      G.current.wasPinned = hit.pinned; // restored on a click, kept on a drag
      hit.pinned = true;
      G.current.dragging = hit;
      G.current.dragStart = { x: pos.x, y: pos.y };
      restartTick(canvasRef.current, G.current, selectedId);
    } else {
      G.current.panning = true;
      G.current._userViewport = true;
      G.current.panStart = { sx, sy, px: G.current.panX || 0, py: G.current.panY || 0 };
    }
  }, [selectedId]);

  const onMouseMove = useCallback(e => {
    const { sx, sy } = screenCoords(e);
    if (G.current.dragging) {
      const pos = toWorld(sx, sy);
      G.current.dragging.x = pos.x;
      G.current.dragging.y = pos.y;
      G.current.dragging.vx = 0;
      G.current.dragging.vy = 0;
      return;
    }
    if (G.current.panning) {
      G.current.panX = G.current.panStart.px + (sx - G.current.panStart.sx);
      G.current.panY = G.current.panStart.py + (sy - G.current.panStart.sy);
      if (!G.current.raf) drawGraph(canvasRef.current, G.current, selectedId);
      return;
    }
    G.current.hovered = hitNode(toWorld(sx, sy), G.current.nodes);
  }, [selectedId]);

  const onMouseUp = useCallback(e => {
    if (G.current.panning) {
      G.current.panning = false; G.current.panStart = null; return;
    }
    if (G.current.suppressClick) {
      G.current.suppressClick = false;
      G.current.dragging = null; G.current.dragStart = null;
      return;
    }
    if (!G.current.dragging) return;
    const { sx, sy } = screenCoords(e);
    const pos = toWorld(sx, sy);
    const start = G.current.dragStart || pos;
    const sc = G.current.scale || 1;
    const dist = Math.sqrt((pos.x - start.x)**2 + (pos.y - start.y)**2) * sc;
    const id = G.current.dragging.id;
    // A real drag leaves the node pinned where it was dropped. A click restores
    // whatever the pin state was before mousedown pinned it unconditionally —
    // without this, merely clicking a node would pin it forever.
    if (dist < 8) G.current.dragging.pinned = G.current.wasPinned;
    G.current.dragging = null;
    G.current.dragStart = null;
    syncPins();
    if (dist < 8) onSelect(id);
  }, [onSelect]);

  const onWheel = useCallback(e => {
    e.preventDefault();
    const { sx, sy } = screenCoords(e);
    const sc = G.current.scale || 1;
    const newSc = Math.min(4, Math.max(0.15, sc * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    G.current.panX = sx - (sx - (G.current.panX || 0)) * newSc / sc;
    G.current.panY = sy - (sy - (G.current.panY || 0)) * newSc / sc;
    G.current.scale = newSc;
    G.current._userViewport = true;
    if (!G.current.raf) drawGraph(canvasRef.current, G.current, selectedId);
  }, [selectedId]);

  const zoomStep = (factor) => {
    G.current.scale = Math.min(4, Math.max(0.15, (G.current.scale || 1) * factor));
    G.current._userViewport = true;
    if (!G.current.raf) drawGraph(canvasRef.current, G.current, selectedId);
  };

  return html`
    <div class=${`panel${active ? '' : ' hidden'}`}>
      <div ref=${wrapRef} class="graph-wrap">
        <canvas class="graph-canvas" ref=${canvasRef}
          onMouseDown=${onMouseDown} onMouseMove=${onMouseMove} onMouseUp=${onMouseUp}
          onWheel=${onWheel}
          onMouseLeave=${() => { G.current.hovered = null; G.current.dragging = null; G.current.panning = false; syncPins(); }}/>
      </div>

      <div class="graph-toolbar">
        <input ref=${searchRef} class="graph-search" type="text" placeholder="search graph…"
          value=${search} onInput=${e => setSearch(e.target.value)} autocomplete="off"/>
        ${search && html`<span class="graph-search-count">${matchCount} / ${G.current.nodes.length}</span>`}
        <div class="graph-pills">
          ${EDGE_TYPES.map(t => html`
            <${Pill} key=${t} label=${t} active=${edgeFilter[t]}
              onClick=${() => setEdgeFilter(f => ({ ...f, [t]: !f[t] }))}/>`)}
        </div>
      </div>

      <div class=${`graph-legend${legendOpen ? '' : ' collapsed'}`} onClick=${() => !legendOpen && setLegendOpen(true)}>
        <div class="legend-hdr">
          <span>Legend</span>
          <span class="legend-toggle" onClick=${(e) => { e.stopPropagation(); setLegendOpen(o => !o); }}>
            ${legendOpen ? '−' : '+'}
          </span>
        </div>
        ${legendOpen && html`
          <Fragment>
            <div class="legend-sec">EDGES</div>
            <div class="legend-row"><span class="legend-edge" style="background:var(--rel)"></span>relation</div>
            <div class="legend-row"><span class="legend-edge" style="background:var(--am)"></span>wikilink</div>
            <div class="legend-row"><span class="legend-edge" style="background:var(--gn)"></span>project</div>
            <div class="legend-row"><span class="legend-edge" style="background:rgba(128,128,128,0.5)"></span>tag</div>
            <div class="legend-sec">NODES</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('research')}}></span>research</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('decision')}}></span>decision</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('pattern')}}></span>pattern</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('note')}}></span>note</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('memo')}}></span>memo</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('question')}}></span>question</div>
            <div class="legend-row"><span class="legend-node" style=${{background:kindColor('intention')}}></span>intention</div>
          </Fragment>`}
      </div>

      <div class="graph-controls">
        <button class="graph-reset" onClick=${() => zoomStep(1.25)}>+</button>
        <button class="graph-reset" onClick=${() => zoomStep(1/1.25)}>−</button>
        ${pinCount > 0 && html`<button class="graph-reset" onClick=${unpinAll}>unpin ${pinCount}</button>`}
        <button class="graph-reset" onClick=${resetGraph}>reset</button>
      </div>
      <div class="graph-hint">drag to pin · shift-click to pin/unpin · drag canvas to pan · scroll to zoom · click to inspect</div>
    </div>`;
}

function canvasPos(e, canvas) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
}

function hitNode(pos, nodes) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    // Radius-aware so degree-sized hubs stay grabbable. A default r=6 node keeps
    // the historic 12px reach (12² = 144).
    const rr = (n.r || 6) + 6;
    if ((pos.x-n.x)**2 + (pos.y-n.y)**2 < rr*rr) return n;
  }
  return null;
}

// ── Graph pins ───────────────────────────────────────────
// A pin is a user assertion, so it outlives reset, refetch and reload. Position
// rides along — a pin whose node springs back to a fresh layout is not a pin.
const PIN_KEY = 'saripati-graph-pins';
function loadPins() {
  try {
    const v = JSON.parse(localStorage.getItem(PIN_KEY) || '[]');
    return Array.isArray(v) ? v.filter(p => p && typeof p.id === 'number') : [];
  } catch { return []; }
}
function savePins(nodes) {
  try {
    localStorage.setItem(PIN_KEY, JSON.stringify(
      nodes.filter(n => n.pinned).map(n => ({ id: n.id, x: n.x, y: n.y }))));
  } catch { /* private mode / quota — pins simply don't persist */ }
}

// Node radius from degree, counting DISTINCT visible neighbours: a pair can
// legitimately yield two edges of different types, but that's one connection.
// sqrt, not log — log flattens so early a 2-edge node reads like a 12-edge one.
function computeDegrees(G) {
  const seen = new Set();
  const deg = new Map();
  for (const e of G.edges) {
    if (G.edgeFilter && G.edgeFilter[e.type] === false) continue;
    if (!G.nodeMap.get(e.from) || !G.nodeMap.get(e.to)) continue; // endpoint beyond NODE_CAP
    const k = e.from < e.to ? `${e.from}:${e.to}` : `${e.to}:${e.from}`;
    if (seen.has(k)) continue;
    seen.add(k);
    deg.set(e.from, (deg.get(e.from) || 0) + 1);
    deg.set(e.to, (deg.get(e.to) || 0) + 1);
  }
  for (const n of G.nodes) {
    n.deg = deg.get(n.id) || 0;
    n.r = Math.min(16, 5 + 2.2 * Math.sqrt(n.deg));
  }
}

// Pure physics step — no drawing, no settled state.
// Nodes are unclamped and live in world space; fitToView() adapts the viewport.
// Returns the average speed (px/frame) across unpinned nodes, used by tick()
// to detect real convergence instead of stopping after a fixed frame count.
function physicsStep(canvas, G, noisy) {
  const REP=2800, SPR=0.012, DAMP=0.86, REST=160, GRAV=0.0008;
  const NOISE = noisy ? 0.14 : 0;
  const W = canvas.width, H = canvas.height;
  const nodeById = id => G.nodeMap?.get(id);

  for (const e of G.edges) {
    // Hidden edge types leave the simulation too — keeping a spring whose line
    // is hidden makes nodes cling for reasons the viewer can no longer see.
    if (G.edgeFilter && G.edgeFilter[e.type] === false) continue;
    const s = nodeById(e.from), t = nodeById(e.to);
    if (!s || !t) continue;
    const dx = t.x-s.x, dy = t.y-s.y, d = Math.sqrt(dx*dx+dy*dy)||1;
    const f = (d-REST)*SPR, fx = dx/d*f, fy = dy/d*f;
    if (!s.pinned) { s.vx += fx; s.vy += fy; }
    if (!t.pinned) { t.vx -= fx; t.vy -= fy; }
  }

  let totalSpeed = 0, moving = 0;
  for (let i = 0; i < G.nodes.length; i++) {
    const n = G.nodes[i];
    if (n.pinned) continue;
    // Weak gravity toward canvas centre — keeps the cluster from drifting away
    // but is light enough to let repulsion spread nodes beyond canvas bounds.
    let fx = (W/2 - n.x) * GRAV + (Math.random()-0.5)*NOISE;
    let fy = (H/2 - n.y) * GRAV + (Math.random()-0.5)*NOISE;
    for (let j = 0; j < G.nodes.length; j++) {
      if (i===j) continue;
      const m = G.nodes[j];
      const dx = n.x-m.x, dy = n.y-m.y, d2 = dx*dx+dy*dy+1, d = Math.sqrt(d2);
      fx += dx/d*REP/d2; fy += dy/d*REP/d2;
    }
    n.vx = (n.vx+fx)*DAMP; n.vy = (n.vy+fy)*DAMP;
    // Unclamped — nodes spread freely; zoom/pan + fitToView handle navigation.
    n.x += n.vx;
    n.y += n.vy;
    totalSpeed += Math.hypot(n.vx, n.vy);
    moving++;
  }
  return moving > 0 ? totalSpeed / moving : 0;
}

// Zoom/pan so all nodes are visible with padding.
function fitToView(canvas, G) {
  if (!G.nodes || !G.nodes.length) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of G.nodes) {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
  }
  const W = canvas.width, H = canvas.height;
  const pw = maxX - minX || 1, ph = maxY - minY || 1;
  const sc = Math.min((W - 80) / pw, (H - 80) / ph, 2.5);
  G.scale = sc;
  G.panX = (W - pw * sc) / 2 - minX * sc;
  G.panY = (H - ph * sc) / 2 - minY * sc;
}

const NOISE_FRAMES = 150;          // seeded/jitter phase length, unchanged from prior cutoff
const SETTLE_SPEED = 0.05;         // px/frame avg speed considered "at rest"
const SETTLE_STREAK_NEEDED = 30;   // ~0.5s @ 60fps of sustained low speed before declaring convergence
const MAX_FRAMES = 1200;           // ~20s @ 60fps hard safety ceiling — non-convergence guarantee only

// Layout phase (noisy) then drain phase, stopping once the layout actually
// settles (or at MAX_FRAMES as a safety net for pathological non-convergence).
// fitToView() fires once on real settle; skipped if user has already panned
// or zoomed (_userViewport flag).
function tick(canvas, G, selectedId) {
  G._frame = (G._frame || 0) + 1;
  const noisy = G._frame < NOISE_FRAMES;
  const avgSpeed = physicsStep(canvas, G, noisy);
  drawGraph(canvas, G, selectedId);

  if (noisy) {
    G._settleStreak = 0; // never count settled frames during the seeded/noisy phase
  } else if (avgSpeed < SETTLE_SPEED) {
    G._settleStreak = (G._settleStreak || 0) + 1;
  } else {
    G._settleStreak = 0;
  }

  const converged = G._settleStreak >= SETTLE_STREAK_NEEDED;
  const timedOut = G._frame >= MAX_FRAMES;

  if (converged || timedOut) {
    if (!G._userViewport) {
      fitToView(canvas, G);
      drawGraph(canvas, G, selectedId);
      G._userViewport = true; // preserve user viewport on subsequent node drags
    }
    G.raf = null; return;
  }
  G.raf = requestAnimationFrame(() => tick(canvas, G, selectedId));
}

function restartTick(canvas, G, selectedId) {
  if (G.raf) return;
  G._frame = 0;
  G._settleStreak = 0;
  tick(canvas, G, selectedId);
}

function drawGraph(canvas, G, selectedId) {
  if (!canvas || !G.ctx) return;
  const ctx = G.ctx, W = canvas.width, H = canvas.height;
  const sc = G.scale || 1, px = G.panX || 0, py = G.panY || 0;
  const activeTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const col = GRAPH_COLORS[activeTheme] || GRAPH_COLORS.light;
  const nodeById = id => G.nodeMap?.get(id);

  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, W, H);

  if (!G.nodes || G.nodes.length === 0) {
    ctx.fillStyle = col.label;
    ctx.font = '12px ui-monospace,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('◈ No connected graph nodes found', W/2, H/2);
    return;
  }

  ctx.save();
  ctx.setTransform(sc, 0, 0, sc, px, py);

  // A search dims everything that doesn't match, rather than filtering nodes
  // out — the layout itself is the context, so it must not rearrange.
  const dim = !!G.search;

  for (const e of G.edges) {
    if (G.edgeFilter && G.edgeFilter[e.type] === false) continue;
    const s = nodeById(e.from), t = nodeById(e.to);
    if (!s || !t) continue;
    ctx.strokeStyle = col.edges[e.type] || col.edges.tag;
    ctx.lineWidth = e.type === 'relation' ? 2 : e.type === 'wikilink' ? 1.5 : 1;
    let a = e.type === 'relation' ? 0.85 : e.type === 'wikilink' ? 0.75 : 0.4;
    if (dim && !(s._match || t._match)) a *= 0.25;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const n of G.nodes) {
    const isSel = n.id === selectedId;
    const base = n.r || 6;
    const r = isSel ? base + 3 : base;
    const hov = G.hovered?.id === n.id;
    ctx.globalAlpha = (dim && !n._match) ? 0.15 : 1;
    ctx.fillStyle = col.nodes[n.kind] || '#888';
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill();
    if (n.pinned) {
      ctx.strokeStyle = col.pin; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, base+2.5, 0, Math.PI*2); ctx.stroke();
    }
    if (dim && n._match) {
      ctx.strokeStyle = col.pin; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, base+5, 0, Math.PI*2); ctx.stroke();
    }
    if (hov || isSel) {
      ctx.strokeStyle = col.ring; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, r+3, 0, Math.PI*2); ctx.stroke();
      const lbl = n.title.length > 32 ? n.title.slice(0,32)+'…' : n.title;
      ctx.font = '11px ui-monospace,monospace';
      ctx.textAlign = 'left';
      const tw = ctx.measureText(lbl).width;
      ctx.fillStyle = activeTheme === 'dark' ? 'rgba(20,20,20,0.92)' : 'rgba(240,239,233,0.94)';
      ctx.fillRect(n.x+12, n.y-10, tw+8, 18);
      ctx.fillStyle = col.label;
      ctx.fillText(lbl, n.x+16, n.y+3);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ── Tags panel ────────────────────────────────────────────
function TagsPanel({ active, onTagSelect }) {
  const [tags, setTags] = useState([]);
  const [filter, setFilter] = useState('');

  useEffect(() => { if (active) api('/api/tags').then(t => setTags(t || [])); }, [active]);

  const filteredTags = useMemo(() => {
    if (!filter.trim()) return tags;
    const f = filter.toLowerCase().trim();
    return tags.filter(t => t.tag.toLowerCase().includes(f));
  }, [tags, filter]);

  const max = useMemo(() => Math.max(1, tags[0]?.count || 1), [tags]);

  return html`
    <div class=${`panel${active ? '' : ' hidden'}`} style="overflow-y:auto">
      <div class="tags-wrap">
        <div class="tags-filter-row">
          <span class="tags-count">${tags.length} unique tags</span>
          <input class="tags-search" type="text" placeholder="filter tags…" value=${filter}
            onInput=${e => setFilter(e.target.value)}/>
        </div>
        <div class="tags-inner">
          ${!filteredTags.length && active && html`<div class="no-results">no tags match</div>`}
          ${filteredTags.map(t => html`
            <div key=${t.tag} class="tag-bar-row" onClick=${() => onTagSelect(t.tag)}>
              <span class="tag-name">#${t.tag}</span>
              <div class="tag-bar-track">
                <div class="tag-bar-fill" style=${{ width:`${Math.round(t.count/max*100)}%` }}></div>
              </div>
              <span class="tag-count">${t.count}</span>
            </div>`)}
        </div>
      </div>
    </div>`;
}

// ── Identity panel ────────────────────────────────────────
function IdentityPanel({ active }) {
  const [identity, setIdentity] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if (!active || loaded) return;
    Promise.all([api('/api/identity'), api('/api/status')]).then(([id, st]) => {
      setIdentity(id);
      setSessions(st?.sessions_recent || []);
      setLoaded(true);
    });
  }, [active]);

  if (!loaded) return html`<div class=${`panel${active ? '' : ' hidden'}`}></div>`;

  const prefs = identity?.user_prefs || {};
  const skills = Array.isArray(prefs.skills) ? prefs.skills : (prefs.skills ? [prefs.skills] : []);
  const cfg = identity?.companion_config || {};
  const traits = Array.isArray(cfg.values) ? cfg.values : Array.isArray(cfg.traits) ? cfg.traits : [];
  const recallBoost = (cfg.recall_boost && typeof cfg.recall_boost === 'object') ? Object.entries(cfg.recall_boost) : [];
  const latestSession = sessions[0] || null;
  const pastSessions = sessions.slice(1);

  return html`
    <div class=${`panel${active ? '' : ' hidden'}`} style="overflow-y:auto">
      <div class="id-inner">
        ${!identity ? html`
          <div class="id-card wide">
            <div class="id-empty">No identity set. Run <strong>saripati onboard</strong> to personalize your vault.</div>
          </div>` : html`
          <div class="id-card">
            <div class="id-lbl">Profile</div>
            ${identity.user_name && html`<div class="id-name">${identity.user_name}</div>`}
            ${identity.user_field && html`<div class="id-field">${identity.user_field}</div>`}
            ${prefs.communication_style && html`<div class="id-row"><span class="id-key">style — </span>${prefs.communication_style}</div>`}
            ${prefs.address && html`<div class="id-row"><span class="id-key">address as — </span>${prefs.address}</div>`}
            ${prefs.language && html`<div class="id-row"><span class="id-key">language — </span>${prefs.language}</div>`}
            ${skills.length > 0 && html`
              <div class="id-chips">
                ${skills.map(s => html`<span key=${s} class="id-chip-skill">${s}</span>`)}
              </div>`}
          </div>
          <div class="id-card">
            <div class="id-lbl">Companion Persona</div>
            ${identity.companion_name
              ? html`
                <div class="id-name">${identity.companion_name}</div>
                ${identity.companion_role && html`<div class="id-field">${identity.companion_role}</div>`}
                ${identity.companion_tone && html`<div class="id-row"><span class="id-key">tone — </span>${identity.companion_tone}</div>`}
                ${traits.length > 0 && html`
                  <div class="id-chips">
                    ${traits.map(t => html`<span key=${t} class="id-chip-trait">${t}</span>`)}
                  </div>`}`
              : html`<div class="id-empty">No companion set.</div>`}
          </div>
          <div class="id-card wide">
            <div class="id-lbl">Companion Config — how the steerer tunes itself</div>
            <div class="cfg-row"><span class="cfg-key">stale threshold</span><span class="cfg-val">${cfg.stale_days != null ? `${cfg.stale_days} days` : '21 days (default)'}</span></div>
            <div class="cfg-row"><span class="cfg-key">conflict threshold</span><span class="cfg-val">${cfg.conflict_threshold != null ? cfg.conflict_threshold : '0.85 (default)'}</span></div>
            ${recallBoost.length > 0
              ? html`
                <div class="det-sec-title" style="margin-top:12px;margin-bottom:8px">Recall Boost (per kind)</div>
                ${recallBoost.map(([k, v]) => html`
                  <div key=${k} class="cfg-row">
                    <span class="cfg-key" style=${{ color: kindColor(k) }}>${k}</span>
                    <span class="cfg-val">×${v}</span>
                  </div>`)}`
              : html`<div class="cfg-row"><span class="cfg-key">recall boost</span><span class="cfg-val">defaults</span></div>`}
          </div>`}

        ${latestSession ? html`
          <div class="id-card wide">
            <div class="id-lbl">Latest Session — ${(latestSession.created_at || '').slice(0,10)}</div>
            <div class="sess-title">${latestSession.title}</div>
            <div class="sess-summary">${latestSession.summary}</div>
            ${(latestSession.next_steps || []).length > 0 && html`
              <div class="det-sec-title" style="margin-bottom:8px">Next Steps</div>
              ${latestSession.next_steps.map((s, i) => html`
                <div key=${i} class="sess-step"><span class="sess-arrow">▸</span>${s}</div>`)}`}
          </div>` : html`
          <div class="id-card wide">
            <div class="id-empty">No sessions recorded yet. Call <code>session_save</code> from your AI host.</div>
          </div>`}

        ${pastSessions.length > 0 && html`
          <div class="id-card wide">
            <div class="id-lbl">Session History — ${pastSessions.length} prior session${pastSessions.length > 1 ? 's' : ''}</div>
            ${pastSessions.map(ps => html`
              <div key=${ps.id || ps.title} class="sess-hist-item">
                <div class="sess-hist-date">${(ps.created_at || '').slice(0,10)}</div>
                <div class="sess-hist-title">${ps.title}</div>
                <div class="sess-hist-snip">${ps.summary}</div>
                ${(ps.next_steps || []).length > 0 && html`
                  <div class="sess-hist-steps">
                    ${ps.next_steps.slice(0,2).map((step, i) => html`
                      <div key=${i} class="sess-hist-step">
                        <span class="sess-hist-step-arrow">▸</span>
                        <span>${step}</span>
                      </div>`)}
                  </div>`}
              </div>`)}
          </div>`}
      </div>
    </div>`;
}

// ── Steer panel (nudges + retrieval trace) ────────────────
function NudgeGroup({ title, hint, items, empty, render }) {
  return html`
    <div class="steer-group">
      <div class="steer-group-hdr">
        <span class="steer-group-title">${title}</span>
        <span class="steer-group-count">${items.length}</span>
      </div>
      ${hint && html`<div class="steer-group-hint">${hint}</div>`}
      ${items.length
        ? items.map(render)
        : html`<div class="steer-empty">${empty}</div>`}
    </div>`;
}

function SteerPanel({ active, onSelect, onProjectClick }) {
  const [nudges, setNudges] = useState(null);
  const [trace, setTrace] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if (!active || loaded) return;
    Promise.all([api('/api/nudges'), api('/api/last-fetch')]).then(([n, t]) => {
      setNudges(n);
      setTrace(t);
      setLoaded(true);
    });
  }, [active]);

  if (!loaded) return html`<div class=${`panel${active ? '' : ' hidden'}`}></div>`;

  const n = nudges || {};
  const entryRow = (e) => html`
    <div key=${e.id} class="steer-row" onClick=${() => onSelect(e.id)}>
      <span class="steer-dot" style=${{ background: kindColor(e.kind) }}></span>
      <span class="steer-row-title">${e.title}</span>
      ${e.project && html`<span class="steer-row-proj">@${e.project}</span>`}
    </div>`;

  return html`
    <div class=${`panel${active ? '' : ' hidden'}`} style="overflow-y:auto">
      <div class="steer-inner">
        <div class="steer-lede">
          <span class="steer-lede-mark">◈</span>
          What to steer — the vault's open threads, drawn from what your past self left behind.
        </div>
        <div class="steer-grid">
          <${NudgeGroup} title="Open Questions" hint="unanswered — resolve or investigate"
            items=${n.unresolved_questions || []} empty="no open questions" render=${entryRow}/>
          <${NudgeGroup} title="Live Intentions" hint="commitments still in flight"
            items=${n.active_intentions || []} empty="no live intentions" render=${entryRow}/>
          <${NudgeGroup} title="Unread Memos" hint="notes left for your future self"
            items=${n.unread_memos || []} empty="no unread memos" render=${entryRow}/>
          <${NudgeGroup} title="Stale Projects" hint="active, but untouched lately"
            items=${n.stale_projects || []} empty="nothing gone stale"
            render=${(pj) => html`
              <div key=${pj.name} class="steer-row" onClick=${() => onProjectClick(pj.name)}>
                <span class="steer-dot" style="background:var(--er)"></span>
                <span class="steer-row-title">@${pj.name}</span>
                <span class="steer-row-stale">${(pj.last_entry_at || '').slice(0,10)}</span>
              </div>`}/>
        </div>

        <div class="steer-trace">
          <div class="steer-group-hdr">
            <span class="steer-group-title">Last Retrieved</span>
          </div>
          <div class="steer-group-hint">what the agent pulled on its most recent recall</div>
          ${trace && trace.results && trace.results.length
            ? html`
              <div class="steer-trace-q">"${trace.query}"<span class="steer-trace-at">${(trace.at || '').slice(0,19).replace('T',' ')}</span></div>
              ${trace.results.map((r) => html`
                <div key=${r.id} class="steer-row" onClick=${() => onSelect(r.id)}>
                  <span class="steer-dot" style=${{ background: kindColor(r.kind) }}></span>
                  <span class="steer-row-title">${r.title}</span>
                  <span class="steer-row-score">${(r.score ?? 0).toFixed(2)}</span>
                </div>`)}`
            : html`<div class="steer-empty">no recall yet — the agent hasn't queried the vault this session</div>`}
        </div>
      </div>
    </div>`;
}

// ── App root ──────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('steer');
  const [theme, setTheme] = useState(() => localStorage.getItem('saripati-theme') || 'light');
  const [writeCfg, setWriteCfg] = useState(false);
  const [writeOn, setWriteOn] = useState(true);
  const [semanticCfg, setSemanticCfg] = useState(false);
  const [semanticOn, setSemanticOn] = useState(true);
  const [status, setStatus] = useState(null);

  // Lifted shared navigation & filter state
  const [selectedId, setSelectedId] = useState(null);
  const [query, setQuery] = useState('');
  const [kindFilter, setKindFilter] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [tagFilter, setTagFilter] = useState('');
  const [projectFilter, setProjectFilter] = useState('');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('saripati-theme', theme);
  }, [theme]);

  useEffect(() => {
    api('/api/config').then(c => {
      if (c.writeMode) setWriteCfg(true);
      if (c.semanticMode) {
        setSemanticCfg(true);
        setSemanticOn(true);
      }
    });
    api('/api/status').then(setStatus);
  }, []);

  const handleTagSelect = (tag) => {
    setTagFilter(tag);
    setKindFilter('');
    setSelectedId(null);
    setTab('entries');
  };

  const handleGraphSelect = (id) => {
    setSelectedId(id);
    setTab('entries');
  };

  const handleKindSelect = (k) => {
    setKindFilter(curr => curr === k ? '' : k);
    setSelectedId(null);
  };

  const handleStatusSelect = (s) => {
    setStatusFilter(curr => curr === s ? '' : s);
    setSelectedId(null);
  };

  // Toggle a project filter and route to the entries tab (used by the Steer tab
  // and the @project chips). Clears kind so the project view isn't double-filtered.
  const handleProjectSelect = (project) => {
    setProjectFilter(f => f === project ? '' : project);
    setKindFilter('');
    setSelectedId(null);
    setTab('entries');
  };

  return html`
    <${Header}
      theme=${theme} onTheme=${setTheme}
      writeCfg=${writeCfg} writeOn=${writeOn} onWrite=${() => setWriteOn(w => !w)}
      semanticCfg=${semanticCfg} semanticOn=${semanticOn} onSemantic=${() => setSemanticOn(s => !s)}
      entryCount=${status?.total}/>
    <${Tabs} tab=${tab} onTab=${setTab}/>
    <div class="panels">
      <${SteerPanel}
        active=${tab === 'steer'}
        onSelect=${handleGraphSelect}
        onProjectClick=${handleProjectSelect}/>
      <${EntriesPanel}
        active=${tab === 'entries'}
        status=${status}
        writeOn=${writeOn}
        semanticOn=${semanticOn}
        selectedId=${selectedId}
        onSelectId=${setSelectedId}
        query=${query}
        onQuery=${setQuery}
        kindFilter=${kindFilter}
        onKind=${handleKindSelect}
        statusFilter=${statusFilter}
        onStatus=${handleStatusSelect}
        tagFilter=${tagFilter}
        onTagFilter=${setTagFilter}
        projectFilter=${projectFilter}
        onProjectFilter=${handleProjectSelect}/>
      <${GraphPanel}
        active=${tab === 'graph'}
        theme=${theme}
        selectedId=${selectedId}
        onSelect=${handleGraphSelect}/>
      <${TagsPanel}
        active=${tab === 'tags'}
        onTagSelect=${handleTagSelect}/>
      <${IdentityPanel}
        active=${tab === 'identity'}/>
    </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
